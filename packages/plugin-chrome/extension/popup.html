<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCode Chrome Agent</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        background: Canvas;
        color: CanvasText;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      .state {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #9ca3af;
      }
      .dot.on {
        background: #34d399;
        box-shadow: 0 0 0 3px #34d39933;
      }
      .dot.off {
        background: #ef4444;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 10px;
        margin: 0 0 12px;
        font-size: 12px;
      }
      dt {
        color: GrayText;
      }
      dd {
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      button {
        width: 100%;
        padding: 7px 10px;
        border: 1px solid ButtonBorder;
        border-radius: 7px;
        background: ButtonFace;
        color: ButtonText;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        filter: brightness(0.97);
      }
      p {
        margin: 10px 0 0;
        font-size: 11px;
        color: GrayText;
      }
    </style>
  </head>
  <body>
    <h1>OpenCode Chrome Agent</h1>
    <div class="state"><span class="dot" id="dot"></span><span id="label">Checking…</span></div>
    <dl>
      <dt>Bridge</dt><dd id="port">—</dd>
      <dt>Chrome</dt><dd id="chrome">—</dd>
      <dt>Extension</dt><dd id="version">—</dd>
      <dt>Tabs</dt><dd id="tabs">—</dd>
    </dl>
    <button id="connect">Reconnect to OpenCode</button>
    <p>Keep OpenCode running. This extension only talks to a loopback bridge on 127.0.0.1.</p>
    <script src="popup.js"></script>
  </body>
</html>
