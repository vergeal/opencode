<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCode Chrome</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: Canvas;
        color: CanvasText;
      }
      main {
        width: min(520px, calc(100vw - 48px));
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
        letter-spacing: -0.01em;
      }
      .state {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 22px;
        color: GrayText;
        font-size: 13px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #9ca3af;
      }
      .dot.on {
        background: #34d399;
        box-shadow: 0 0 0 3px #34d39933;
      }
      .dot.off {
        background: #ef4444;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 12px;
      }
      li {
        display: grid;
        grid-template-columns: 26px 1fr;
        gap: 10px;
        align-items: start;
      }
      .n {
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: color-mix(in srgb, CanvasText 8%, transparent);
        font-size: 13px;
        font-weight: 600;
      }
      strong {
        display: block;
        font-weight: 600;
      }
      span.body {
        color: GrayText;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OpenCode Chrome</h1>
      <div class="state"><span class="dot" id="dot"></span><span id="label">正在连接 OpenCode…</span></div>
      <ul>
        <li>
          <span class="n">1</span>
          <span>
            <strong>这个窗口归 OpenCode 使用</strong>
            <span class="body">它和你日常用的 Chrome 相互独立，OpenCode 不会读取或改动那边的标签页与登录状态。</span>
          </span>
        </li>
        <li>
          <span class="n">2</span>
          <span>
            <strong>需要登录的网站，在这里登录一次</strong>
            <span class="body">登录信息保存在这个专用窗口里，下次启动仍然有效。</span>
          </span>
        </li>
        <li>
          <span class="n">3</span>
          <span>
            <strong>打开任务页面后，这个标签会自动关闭</strong>
            <span class="body">你随时可以在这里自己操作，OpenCode 能看到页面当前状态并接着做。</span>
          </span>
        </li>
      </ul>
    </main>
    <script src="welcome.js"></script>
  </body>
</html>
